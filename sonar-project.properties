# ============================================================
# SonarQube Project Configuration — EatOClock Backend
# ============================================================

# Required: unique project key in your SonarQube instance
sonar.projectKey=eatoclock-backend
sonar.projectName=EatOClock Backend
sonar.projectVersion=1.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Base directory (repo root for the backend)
sonar.sources=.

# Exclude generated, migration and boilerplate code from analysis
sonar.exclusions=\
  **/Migrations/**,\
  **/bin/**,\
  **/obj/**,\
  **/*.Designer.cs,\
  **/Program.cs

# Test sources
sonar.tests=Tests

# Coverage report — generated by coverlet when tests run
sonar.cs.opencover.reportsPaths=Tests/EatOClock.Tests/TestResults/coverage.opencover.xml

# Language
sonar.language=cs
