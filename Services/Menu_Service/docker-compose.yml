version: "3.8"

services:
  menu-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menu-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=menu-db;Port=5432;Database=EatOClock_Menu;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      menu-db:
        condition: service_healthy
    networks:
      - eatoclock-network
    restart: unless-stopped

  menu-db:
    image: postgres:16-alpine
    container_name: menu-db
    environment:
      POSTGRES_DB: EatOClock_Menu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432"
    volumes:
      - menu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eatoclock-network
    restart: unless-stopped

volumes:
  menu-db-data:

networks:
  eatoclock-network:
    name: eatoclock-network
