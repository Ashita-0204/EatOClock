    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_Notification;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
      - Email__SenderName=EatOClock
      - Email__SenderEmail=ashitavarshney37532@gmail.com
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SmtpUser=${SMTP_USER}
      - Email__SmtpPass=${SMTP_PASS}
      - Twilio__AccountSid=${TWILIO_SID}
      - Twilio__AuthToken=${TWILIO_TOKEN}
      - Twilio__FromNumber=+12296334316
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eatoclock_network

  api-gateway:
    build:
      context: ./API-Gateway/EatOClock.Gateway
      dockerfile: Dockerfile
    container_name: eatoclock_gateway
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
      - Services__Auth=http://auth-service:8080
      - Services__Restaurant=http://restaurant-service:8080
      - Services__Menu=http://menu-service:8080
      - Services__Cart=http://cart-service:8080
      - Services__Order=http://order-service:8080
      - Services__Payment=http://payment-service:8080
      - Services__Notification=http://notification-service:8080
      - Services__DeliveryAgent=http://delivery-agent-service:8080
      - Services__Review=http://review-service:8080
    depends_on:
      - auth-service
      - restaurant-service
      - menu-service
      - cart-service
      - order-service

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
