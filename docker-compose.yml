services:
  redis:
    image: redis:7-alpine
    container_name: eatoclock_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eatoclock_network

  postgres:
    image: postgres:15
    container_name: eatoclock_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: EatOClock_Auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EatOClock_Auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eatoclock_network

  auth-service:
    build:
      context: ./Services/Auth_Service
      dockerfile: Dockerfile
    container_name: eatoclock_auth
    restart: always
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_Auth;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eatoclock_network

  restaurant-service:
    build:
      context: ./Services/Restaurant_Service
      dockerfile: Dockerfile
    container_name: eatoclock_restaurant
    restart: always
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_Restaurant;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eatoclock_network

  menu-service:
    build:
      context: ./Services/Menu_Service
      dockerfile: Dockerfile
    container_name: menu-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_Menu;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eatoclock_network
    restart: unless-stopped

  cart-service:
    build:
      context: ./Services/Cart_Service
      dockerfile: Dockerfile
    container_name: eatoclock_cart
    restart: always
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_Cart;Username=postgres;Password=admin
      - ConnectionStrings__Redis=eatoclock_redis:6379
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eatoclock_network

  order-service:
    build:
      context: ./Services/Order_Service
      dockerfile: Dockerfile
    container_name: eatoclock_order
    restart: always
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_Order;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      postgres:
