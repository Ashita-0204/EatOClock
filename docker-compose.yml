      - ConnectionStrings__DefaultConnection=Host=aws-1-ap-southeast-2.pooler.supabase.com;Port=6543;Database=postgres;Username=postgres.jshgbjiarqayiqepvnjl;Password=Rabies0209_@;SSL Mode=Require;Trust Server Certificate=true;Search Path=payments;;Pooling=true;No Reset On Close=true
