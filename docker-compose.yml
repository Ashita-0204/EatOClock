    container_name: eatoclock_payment
    restart: always
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_Payment;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
      - Razorpay__KeyId=rzp_test_SgfCRuu9X6N01T
      - Razorpay__KeySecret=o96sDqkSIeyb0gHqgRzKLgl2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eatoclock_network
  delivery-agent-service:
    build:
      context: ./Services/DeliveryAgent_Service
      dockerfile: Dockerfile
    container_name: eatoclock_delivery_agent
    restart: always
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_DeliveryAgent;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eatoclock_network

  review-service:
    build:
      context: ./Services/Review_Service
      dockerfile: Dockerfile
    container_name: eatoclock_review
    restart: always
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EatOClock_Review;Username=postgres;Password=admin
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
