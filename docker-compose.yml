services:
  redis:
    image: redis:7-alpine
    container_name: eatoclock_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eatoclock_network

  auth-service:
    build:
      context: ./Services/Auth_Service
      dockerfile: Dockerfile
    container_name: eatoclock_auth
    restart: always
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=aws-1-ap-southeast-2.pooler.supabase.com;Port=6543;Database=postgres;Username=postgres.jshgbjiarqayiqepvnjl;Password=Rabies0209_@;SSL Mode=Require;Trust Server Certificate=true;Search Path=auth_custom;;Pooling=true;No Reset On Close=true
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    networks:
      - eatoclock_network

  restaurant-service:
    build:
      context: ./Services/Restaurant_Service
      dockerfile: Dockerfile
    container_name: eatoclock_restaurant
    restart: always
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=aws-1-ap-southeast-2.pooler.supabase.com;Port=6543;Database=postgres;Username=postgres.jshgbjiarqayiqepvnjl;Password=Rabies0209_@;SSL Mode=Require;Trust Server Certificate=true;Search Path=restaurants;;Pooling=true;No Reset On Close=true
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    networks:
      - eatoclock_network

  menu-service:
    build:
      context: ./Services/Menu_Service
      dockerfile: Dockerfile
    container_name: menu-service
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=aws-1-ap-southeast-2.pooler.supabase.com;Port=6543;Database=postgres;Username=postgres.jshgbjiarqayiqepvnjl;Password=Rabies0209_@;SSL Mode=Require;Trust Server Certificate=true;Search Path=restaurants
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    networks:
      - eatoclock_network

  cart-service:
    build:
      context: ./Services/Cart_Service
      dockerfile: Dockerfile
    container_name: eatoclock_cart
    restart: always
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=aws-1-ap-southeast-2.pooler.supabase.com;Port=6543;Database=postgres;Username=postgres.jshgbjiarqayiqepvnjl;Password=Rabies0209_@;SSL Mode=Require;Trust Server Certificate=true;Search Path=orders;;Pooling=true;No Reset On Close=true
      - ConnectionStrings__Redis=eatoclock_redis:6379
      - Jwt__Key=mysecretkey1234567890mysecretkey1234567890
      - Jwt__Issuer=EatOClock
      - Jwt__Audience=EatOClockUsers
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eatoclock_network

  order-service:
